[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# Match scripts/deploy-psp-verifier.mjs so tested and deployable PspVerifier
# bytecode use the same compiler, optimizer, and IR pipeline.
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 24
fail_on_revert = false

# Heavier exploration in CI: run with FOUNDRY_PROFILE=ci. It inherits the
# compiler configuration above and overrides only fuzz/invariant budgets.
[profile.ci.fuzz]
runs = 512

[profile.ci.invariant]
runs = 256
depth = 32
fail_on_revert = false
